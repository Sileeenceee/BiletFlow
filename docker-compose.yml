services:
  postgres:
    image: postgres:16-alpine
    container_name: biletflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: biletflow
      POSTGRES_USER: biletflow
      POSTGRES_PASSWORD: biletflow123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biletflow -d biletflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend/BiletFlow.Api
      dockerfile: Dockerfile
    container_name: biletflow-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=biletflow;Username=biletflow;Password=biletflow123
      PublicAppBaseUrl: http://localhost:8080
      Email__SmtpHost: mailpit
      Email__SmtpPort: "1025"
      Email__From: "BiletFlow <no-reply@biletflow.local>"
      ASPNETCORE_URLS: http://+:6767;https://+:6969
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/devcert.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: changeit
    ports:
      - "6767:6767"
      - "6969:6969"
    entrypoint: >
      /bin/sh -c "mkdir -p /https &&
      openssl req -x509 -newkey rsa:2048 -nodes -keyout /https/dev.key -out /https/dev.crt -days 365 -subj '/CN=localhost' >/dev/null 2>&1 &&
      openssl pkcs12 -export -out /https/devcert.pfx -inkey /https/dev.key -in /https/dev.crt -password pass:changeit >/dev/null 2>&1 &&
      exec dotnet BiletFlow.Api.dll"
    healthcheck:
      test:
        - CMD
        - /usr/bin/bash
        - -c
        - |
          exec 3<>/dev/tcp/127.0.0.1/6767
          printf 'GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          IFS= read -r status <&3
          [[ "$$status" == *" 200 OK"* ]]
      interval: 15s
      timeout: 5s
      retries: 10

  mailpit:
    # Local SMTP inbox for demonstration emails (verification, tickets, refunds, support). Web UI: http://localhost:8025
    image: axllent/mailpit:v1.21
    container_name: biletflow-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: biletflow-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  postgres_data:
